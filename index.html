<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POS Assistant · by Irete Labs</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#34d399">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="POS Assistant">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>try{var t=localStorage.getItem('irete_theme');if(t==='light')document.documentElement.classList.remove('dark')}catch(e){}</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.num{font-variant-numeric:tabular-nums}
.card{@apply rounded-2xl}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pop{animation:pop .35s ease}
input:focus{outline:2px solid #34d399}
</style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen">
<header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-950/90 backdrop-blur border-b border-slate-200 dark:border-slate-800">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
    <div class="w-9 h-9 rounded-xl bg-emerald-400 text-slate-950 grid place-items-center font-black">P</div>
    <div class="leading-tight"><div class="font-bold">POS Assistant</div><div class="text-xs text-slate-500 dark:text-slate-400">by Irete Labs</div></div>
    <div class="ml-auto flex items-center gap-2">
      <label class="flex items-center gap-2 text-xs cursor-pointer select-none">
        <span class="hidden sm:inline text-slate-500 dark:text-slate-400">Auto-simulate terminal</span>
        <span class="sm:hidden text-slate-500 dark:text-slate-400">Sim</span>
        <input id="sim" type="checkbox" class="sr-only peer">
        <span class="w-10 h-6 rounded-full bg-slate-300 dark:bg-slate-700 peer-checked:bg-emerald-400 relative transition after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-5 after:h-5 after:rounded-full after:bg-white after:transition peer-checked:after:translate-x-4"></span>
      </label>
      <span id="cs" class="hidden sm:inline text-xs text-slate-500 dark:text-slate-400"></span>
      <button id="prem" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 hidden text-amber-400" aria-label="Premium"><i data-lucide="crown" class="w-5 h-5"></i></button>
      <button id="team" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 hidden" aria-label="Team"><i data-lucide="users" class="w-5 h-5"></i></button>
      <button id="theme" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800" aria-label="Toggle theme"><i data-lucide="sun-moon" class="w-5 h-5"></i></button>
      <button id="cfg" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800" aria-label="Settings"><i data-lucide="settings" class="w-5 h-5"></i></button>
      <button id="out" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 hidden" aria-label="Sign out"><i data-lucide="log-out" class="w-5 h-5"></i></button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-4 space-y-4" id="app"></main>
<div id="modal"></div>
<div id="auth"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-50 pointer-events-none"></div>

<script>
const K='irete_pos_v1',$=s=>document.querySelector(s);
const ymd=(off=0)=>new Date(Date.now()-off*864e5).toLocaleDateString('en-CA');
const fmt=n=>(n<0?'-':'')+'₦'+Math.abs(Math.round(n)).toLocaleString('en-NG');
const DEF={set:{wMode:'manual',wVal:0,tMode:'manual',tVal:0,blk:10000,pct:0,cap:0,low:20000},day:null,hist:[]};
// ===== CLOUD CONFIG: fill these in (leave SB_URL empty to run in local-only mode) =====
const SB_URL='',SB_KEY='',PAYSTACK_KEY='',PRICE_NGN=3000;
const BANK={bank:'',acct:'',holder:''}; // your bank details for manual transfer payments
const cloud=!!(SB_URL&&SB_KEY);
let KEY=K,S,sb,user=null,okAccess=true,acc={},syncT=null,pollT=null;
const clone=o=>JSON.parse(JSON.stringify(o));
const newDay=()=>({id:Date.now(),date:ymd(),open:null,inj:[],tx:[],closed:null,del:[],idel:[]});
function load(key){
  KEY=key;try{S=JSON.parse(localStorage.getItem(KEY))||clone(DEF)}catch(e){S=clone(DEF)}
  S.set=Object.assign({},DEF.set,S.set);S.hist=S.hist||[];
  if(!S.day)S.day=newDay();
  if(S.day.date!==ymd()){ // archive a stale unreconciled shift
    if(!S.day.closed&&S.day.open!==null){S.day.closed={auto:true};S.hist.push(S.day)}
    S.day=newDay();
  }
  persist();
}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{persist();queueSync()};

// ---- business maths ----
// Withdrawal: customer swipes amount+fee, gets cash=amount. Processor cost = pct% capped.
// Transfer: customer sends amount to our bank, gets cash = amount - fee.
function calc(a,type){
  const s=S.set,w=type==='w',m=w?s.wMode:s.tMode,x=w?s.wVal:s.tVal;
  const fee=m==='fixed'?x:m==='pct'?a*x/100:m==='block'?Math.ceil(a/(s.blk||10000))*x:0;
  return {fee:Math.round(fee),cost:w?Math.min(a*s.pct/100,s.cap||Infinity):0};
}
function mk(a,type,fee,cost,src,ref,t,cash){
  const w=type==='w',co=w?a:(cash!=null?cash:a-fee),fe=w?fee:a-co,di=w?a+fee-cost:a;
  return {id:Math.random().toString(36).slice(2),t:t||Date.now(),type,a,fee:fe,cost,cashOut:co,digIn:di,profit:fe-cost,src:src||'manual',ref:ref||''};
}
const sum=(arr,f)=>arr.reduce((x,y)=>x+f(y),0);
function stats(d){
  const inj=sum(d.inj,i=>i.a),cashOut=sum(d.tx,t=>t.cashOut),digIn=sum(d.tx,t=>t.digIn);
  return {inj,cashOut,digIn,vol:sum(d.tx,t=>(t.type==='w'||t.type==='t')?t.a:0),credit:sum(d.tx,t=>t.type==='d'?t.a:t.type==='r'?-t.a:0),profit:sum(d.tx,t=>t.profit),n:d.tx.length,
    drawer:(d.open||0)+inj-cashOut, expCash:(d.open||0)+inj-cashOut};
}

// ---- UI helpers ----
const inp='w-full rounded-xl px-4 py-3 text-lg num bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700';
const btn='rounded-xl px-4 py-3 font-semibold transition active:scale-95';
function modal(html){
  $('#modal').innerHTML=`<div class="fixed inset-0 z-40 bg-black/60 grid items-end sm:place-items-center" onclick="if(event.target===this)closeM()">
  <div class="pop w-full sm:max-w-md bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl p-5 max-h-[92vh] overflow-y-auto" style="padding-bottom:max(1.25rem,env(safe-area-inset-bottom))">${html}</div></div>`;
  lucide.createIcons();
}
const closeM=()=>$('#modal').innerHTML='';
function toast(msg,cls='bg-emerald-400 text-slate-950'){
  const e=document.createElement('div');e.className='pop px-4 py-2 mb-2 rounded-xl text-sm font-semibold shadow-lg '+cls;e.textContent=msg;
  $('#toast').appendChild(e);setTimeout(()=>e.remove(),2600);
}
const v=id=>parseFloat($('#'+id).value)||0;

// ---- actions ----
function startDay(){
  const o=v('f_open');if(o<0)return;
  S.day.open=o;save();closeM();render();toast('Opening float set: '+fmt(o));
}
function openStart(edit){modal(`<h3 class="text-xl font-bold mb-1">${edit?'Edit opening float':'Start the day'}</h3><p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Cash you started the day with in the drawer.</p>
  <input id="f_open" type="number" inputmode="numeric" class="${inp}" placeholder="Opening cash float (₦)" value="${edit?S.day.open:''}" autofocus>
  <button class="${btn} w-full mt-4 bg-emerald-400 text-slate-950" onclick="startDay()">${edit?'Save':'Open session'}</button>`)}
function openInject(){modal(`<h3 class="text-xl font-bold mb-1">Cash injection</h3><p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Extra physical cash added to the till.</p>
  <input id="f_inj" type="number" inputmode="numeric" class="${inp}" placeholder="Amount (₦)" autofocus>
  <input id="f_note" class="${inp} mt-3 !text-base" placeholder="Note (optional, e.g. from owner)">
  <button class="${btn} w-full mt-4 bg-sky-400 text-slate-950" onclick="doInject()">Add cash to drawer</button>`)}
function doInject(){const a=v('f_inj');if(a<=0)return toast('Enter an amount','bg-rose-500 text-white');
  S.day.inj.push({a,t:Date.now(),note:$('#f_note').value});save();closeM();render();toast(fmt(a)+' added to drawer','bg-sky-400 text-slate-950')}

let feeTouched=false;
function openTxn(type){
  feeTouched=false;const w=type==='w';
  modal(`<h3 class="text-xl font-bold mb-1">${w?'Cash withdrawal':'Transfer received'}</h3>
  <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">${w?'Customer swipes card (amount + your charge), you give cash.':'Customer sends money to your account, you give cash.'}</p>
  <label class="block text-xs mb-1 text-slate-500 dark:text-slate-400">${w?'Cash amount':'Amount received in account'} (₦)</label>
  <input id="f_amt" type="number" inputmode="numeric" class="${inp}" oninput="prev('${type}','a')" autofocus>
  <div class="grid grid-cols-4 gap-2 mt-2">${[5000,10000,20000,50000].map(x=>`<button class="text-xs py-2 rounded-lg bg-slate-200 dark:bg-slate-800" onclick="$('#f_amt').value=${x};prev('${type}','a')">${x/1000}k</button>`).join('')}</div>
  <label class="block text-xs mt-4 mb-1 text-slate-500 dark:text-slate-400">Your charge (₦)</label>
  <input id="f_fee" type="number" inputmode="numeric" class="${inp}" oninput="prev('${type}','f')">
  ${w?'':`<label class="block text-xs mt-3 mb-1 text-slate-500 dark:text-slate-400">Cash given to customer (₦)</label>
  <input id="f_cash" type="number" inputmode="numeric" class="${inp}" oninput="prev('t','c')">`}
  <input id="f_ref" class="${inp} mt-3 !text-base" placeholder="Customer / bank ref (optional)">
  <div id="prev" class="mt-4 rounded-xl p-3 bg-slate-100 dark:bg-slate-800 text-sm space-y-1"></div>
  <button class="${btn} w-full mt-4 ${w?'bg-amber-400':'bg-emerald-400'} text-slate-950" onclick="doTxn('${type}')">Record transaction</button>`);
  prev(type,'a');
}
function prev(type,src){
  const a=v('f_amt'),w=type==='w';
  if(src==='f'||src==='c')feeTouched=true;
  if(src==='a'&&!feeTouched){const f=calc(a,type).fee;$('#f_fee').value=a>0&&f?f:''}
  if(src==='c')$('#f_fee').value=a>0?a-v('f_cash'):'';
  const fee=v('f_fee');
  if(!w&&src!=='c')$('#f_cash').value=a>0?a-fee:'';
  const t=mk(a,type,fee,w?calc(a,type).cost:0,0,0,0,w?null:v('f_cash'));
  $('#prev').innerHTML=a>0?`<div class="flex justify-between"><span>Cash to give</span><b class="num">${fmt(t.cashOut)}</b></div>
  <div class="flex justify-between"><span>${w?'Digital received (card + charge)':'Digital received'}</span><b class="num">${fmt(t.digIn)}</b></div>
  ${t.cost?`<div class="flex justify-between"><span>Processor cost</span><b class="num">${fmt(t.cost)}</b></div>`:''}
  <div class="flex justify-between ${t.profit<0?'text-rose-500':'text-emerald-500'}"><span>Your profit</span><b class="num">${fmt(t.profit)}</b></div>`:'<span class="text-slate-500">Enter an amount to preview.</span>';
}
function doTxn(type){
  const a=v('f_amt'),w=type==='w';
  if(a<=0)return toast('Enter an amount','bg-rose-500 text-white');
  const t=mk(a,type,v('f_fee'),w?calc(a,type).cost:0,'manual',$('#f_ref').value,0,w?null:v('f_cash'));
  if(t.cashOut<0)return toast('Cash given cannot be negative','bg-rose-500 text-white');
  const short=t.cashOut>stats(S.day).drawer;
  S.day.tx.unshift(t);save();closeM();render();
  toast((w?'Withdrawal ':'Transfer ')+fmt(a)+' recorded · profit '+fmt(t.profit));
  if(short)setTimeout(()=>toast('Drawer cash is now negative: check float/injections','bg-rose-500 text-white'),400);
}
function voidTx(id,b){
  if(!b.dataset.s){b.dataset.s=1;b.textContent='tap again to void';setTimeout(()=>{b.dataset.s='';b.textContent='void'},3000);return}
  (S.day.del=S.day.del||[]).push(id);S.day.tx=S.day.tx.filter(t=>t.id!==id);save();render();
}
function delInj(i,b){
  if(!b.dataset.s){b.dataset.s=1;b.textContent='sure?';setTimeout(()=>{b.dataset.s='';b.textContent='remove'},3000);return}
  (S.day.idel=S.day.idel||[]).push(S.day.inj[i].t);S.day.inj.splice(i,1);save();render();
}
function eraseAll(b){
  if(!b.dataset.s){b.dataset.s=1;b.textContent='Tap again to erase everything';return}
  localStorage.removeItem(KEY);location.reload();
}
function openClose(){
  const st=stats(S.day);
  modal(`<h3 class="text-xl font-bold mb-1">Close day / shift balance</h3>
  <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Count the physical cash in your drawer.</p>
  <label class="block text-xs mb-1 text-slate-500 dark:text-slate-400">Physical cash counted</label>
  <input id="f_cnt" type="number" inputmode="numeric" class="${inp}" oninput="recon()" autofocus>
  <label class="block text-xs mt-3 mb-1 text-slate-500 dark:text-slate-400">Bank received today (optional, from statement)</label>
  <input id="f_bank" type="number" inputmode="numeric" class="${inp}" oninput="recon()">
  <div class="mt-4 rounded-xl p-3 bg-slate-100 dark:bg-slate-800 text-sm space-y-1">
    <div class="flex justify-between"><span>Expected cash</span><b class="num">${fmt(st.expCash)}</b></div>
    <div class="flex justify-between"><span>Expected digital inflow</span><b class="num">${fmt(st.digIn)}</b></div>
    <div class="flex justify-between"><span>Net profit today</span><b class="num text-emerald-500">${fmt(st.profit)}</b></div>
  </div>
  <div id="rc" class="mt-3"></div>
  <button class="${btn} w-full mt-4 bg-rose-500 text-white" onclick="doClose()">Close &amp; lock day</button>`);
}
function rec(){
  const st=stats(S.day),cnt=v('f_cnt'),bk=$('#f_bank').value;
  const vc=cnt-st.expCash,vb=bk===''?null:parseFloat(bk)-st.digIn;
  return {st,cnt,vc,vb,bk};
}
function flag(label,x){
  const c=x===0?'bg-emerald-500/15 text-emerald-500':x>0?'bg-emerald-500/15 text-emerald-500':'bg-rose-500/15 text-rose-500';
  const w=x===0?'BALANCED':x>0?'OVERAGE +'+fmt(x):'SHORTAGE '+fmt(x);
  return `<div class="rounded-xl p-3 ${c} flex justify-between items-center"><span class="text-sm">${label}</span><b class="text-base num">${w}</b></div>`;
}
function recon(){
  if($('#f_cnt').value==='')return $('#rc').innerHTML='';
  const r=rec();
  $('#rc').innerHTML=`<div class="space-y-2">${flag('Cash',r.vc)}${r.vb===null?'':flag('Digital',r.vb)}</div>`;
}
function doClose(){
  if($('#f_cnt').value==='')return toast('Enter counted cash','bg-rose-500 text-white');
  const r=rec();
  S.day.closed={at:Date.now(),counted:r.cnt,varCash:r.vc,bankSeen:r.bk===''?null:parseFloat(r.bk),varBank:r.vb,expCash:r.st.expCash,expBank:r.st.digIn};
  S.hist.push(S.day);save();closeM();$('#sim').checked=false;stopSim();render();
}
function newShift(){S.day=newDay();save();render()}

function openCfg(){
  const s=S.set,sel=(id,m)=>`<select id="${id}" class="${inp} !text-base">${[['manual','I enter it each time'],['fixed','Fixed ₦ per transaction'],['pct','% of amount'],['block','₦ per block of amount']].map(o=>`<option value="${o[0]}" ${o[0]===m?'selected':''}>${o[1]}</option>`).join('')}</select>`;
  const f=(id,l,x)=>`<label class="block text-xs mt-3 mb-1 text-slate-500 dark:text-slate-400">${l}</label><input id="${id}" type="number" step="any" class="${inp}" value="${x}">`;
  modal(`<h3 class="text-xl font-bold">Your charges</h3><p class="text-sm text-slate-500 dark:text-slate-400">You decide how fees work. The charge is always editable on each transaction.</p>
  <div class="font-semibold mt-4">Withdrawals</div>${sel('s_wm',s.wMode)}${f('s_wv','Value (₦ or %, ignored if “each time”)',s.wVal)}
  <div class="font-semibold mt-4">Transfers</div>${sel('s_tm',s.tMode)}${f('s_tv','Value (₦ or %, ignored if “each time”)',s.tVal)}
  ${f('s_b','Block size for “per block” (₦)',s.blk)}
  <div class="font-semibold mt-4">Optional: your own cost</div>
  ${f('s_p','Processor cost on withdrawals (% of amount, 0 if none)',s.pct)}${f('s_c','Cost cap per transaction (₦, 0 = no cap)',s.cap)}
  ${f('s_l','Low-cash warning below (₦)',s.low)}
  <button class="${btn} w-full mt-4 bg-emerald-400 text-slate-950" onclick="saveCfg()">Save</button>
  <button class="${btn} w-full mt-2 bg-slate-200 dark:bg-slate-800" onclick="demo()" ${cloud?'hidden':''}>Load 6 days of demo history</button>
  <button class="${btn} w-full mt-2 text-rose-500 border border-rose-500/40" onclick="eraseAll(this)" ${cloud?'hidden':''}>Erase all data</button>`);
}
function saveCfg(){S.set={wMode:$('#s_wm').value,wVal:v('s_wv'),tMode:$('#s_tm').value,tVal:v('s_tv'),blk:v('s_b')||10000,pct:v('s_p'),cap:v('s_c'),low:v('s_l')};save();closeM();render();pushSet();toast('Charges saved')}
function demo(){
  S.hist=S.hist.filter(d=>!d.demo);
  for(let i=6;i>=1;i--){
    const d=newDay();d.id=i;d.demo=1;d.date=ymd(i);d.open=50000;
    const n=12+Math.floor(Math.random()*14);
    for(let k=0;k<n;k++){const a=[2000,5000,10000,15000,20000,30000,50000][Math.floor(Math.random()*7)],ty=Math.random()<.6?'w':'t';d.tx.push(mk(a,ty,Math.ceil(a/10000)*100,0,'demo'));}
    const st=stats(d);d.closed={at:Date.now(),counted:st.expCash,varCash:0,expCash:st.expCash,expBank:st.digIn};S.hist.push(d);
  }
  save();closeM();render();
}

// ---- simulator ----
let simT=null;const BANKS=['GTBank','Access','Zenith','UBA','First Bank','Opay','Moniepoint','Kuda'];
function stopSim(){clearInterval(simT);simT=null}
function simTick(){
  const d=S.day;if(d.open===null||d.closed)return;
  const a=[2000,3000,5000,10000,15000,20000,30000,50000][Math.floor(Math.random()*8)];
  let ty=Math.random()<.6?'w':'t';if(ty==='w'&&a>stats(d).drawer)ty='t';
  const c=calc(a,ty),t=mk(a,ty,c.fee||Math.ceil(a/10000)*100,c.cost,'terminal',BANKS[Math.floor(Math.random()*BANKS.length)]);
  if(t.cashOut>stats(d).drawer)return toast('Terminal skipped: drawer too low','bg-rose-500 text-white');
  d.tx.unshift(t);save();render();toast('Terminal: '+(ty==='w'?'Withdrawal ':'Transfer ')+fmt(a));
}
$('#sim').onchange=e=>{
  if(!e.target.checked)return stopSim();
  if(S.day.open===null||S.day.closed){e.target.checked=false;return toast('Start a day first','bg-rose-500 text-white')}
  simT=setInterval(simTick,3500);simTick();
};
$('#cfg').onclick=openCfg;
$('#theme').onclick=()=>{const d=document.documentElement.classList.toggle('dark');try{localStorage.setItem('irete_theme',d?'dark':'light')}catch(e){}render()};

// ---- render ----
let charts={};
function render(){
  const d=S.day,st=stats(d),low=st.drawer<S.set.low,open=d.open!==null,closed=!!d.closed;
  const card='rounded-2xl p-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800';
  const sub='text-xs text-slate-500 dark:text-slate-400';
  const sum4=[['Total volume',fmt(st.vol),'text-sky-500','trending-up'],['Commissions earned',fmt(st.profit),'text-emerald-500','coins'],['Transactions',st.n,'text-violet-400','receipt'],
    ['Cash liquidity',low&&open?'LOW':'Healthy',low&&open?'text-rose-500':'text-emerald-500','droplet']];
  $('#app').innerHTML=`
  ${installCard()}
  <section class="${card} flex flex-wrap items-center gap-3">
    <div><div class="${sub}">${new Date().toLocaleDateString('en-NG',{weekday:'long',day:'numeric',month:'long'})}${acc.txt?' · '+acc.txt:''}</div>
      <div id="cs2" class="${sub} ${/^(Offline|Setup)/.test(syncMsg)?'!text-rose-500 font-semibold':''}">${syncMsg}</div>
      <div class="font-bold text-lg">${!open?'No active session':closed?'Day closed':'Session open'}
      ${open?`<span class="text-sm font-normal ${sub}">· float ${fmt(d.open)}</span>`:''}</div></div>
    <div class="ml-auto flex gap-2 flex-wrap">
      ${!open?`<button class="${btn} bg-emerald-400 text-slate-950" onclick="openStart()">Start day</button>`:
        closed?`<button class="${btn} bg-emerald-400 text-slate-950" onclick="newShift()">Start new shift</button>`:

function drawCharts(){

  all.forEach(d=>{const s=stats(d),o=by[d.date]=by[d.date]||{vol:0,cash:0,dig:0,pr:0};o.vol+=s.vol;o.cash+=s.cashOut;o.dig+=s.digIn;o.pr+=s.profit});
  const keys=Object.keys(by).sort().slice(-7),lab=keys.map(k=>k.slice(5));
  const opt={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:x=>x>=1000?x/1000+'k':x}}}};
  const cfgs={

    c2:{type:'bar',data:{labels:lab,datasets:[{label:'Cash out',data:keys.map(k=>by[k].cash),backgroundColor:'#fbbf24',borderRadius:4},{label:'Digital in',data:keys.map(k=>by[k].dig),backgroundColor:'#38bdf8',borderRadius:4}]},options:{...opt,plugins:{legend:{display:true,labels:{boxWidth:10}}}}},
    c3:{type:'line',data:{labels:lab,datasets:[{data:keys.map(k=>by[k].pr),borderColor:'#34d399',backgroundColor:'rgba(52,211,153,.15)',fill:true,tension:.35,pointRadius:4}]},options:opt}
  };
  for(const id in cfgs){if(charts[id])charts[id].destroy();const el=$('#'+id);if(el)charts[id]=new Chart(el,cfgs[id])}

function mergeDay(a,b){
  const del=[...new Set([...(a.del||[]),...(b.del||[])])],idel=[...new Set([...(a.idel||[]),...(b.idel||[])])];
  const m=new Map();[...(b.tx||[]),...(a.tx||[])].forEach(t=>m.set(t.id,t));
  const im=new Map();[...(b.inj||[]),...(a.inj||[])].forEach(x=>im.set(x.t,x));
  return {...a,tx:[...m.values()].filter(t=>!del.includes(t.id)).sort((x,y)=>y.t-x.t),
    inj:[...im.values()].filter(x=>!idel.includes(x.t)).sort((x,y)=>x.t-y.t),del,idel,
    open:a.open!==null&&a.open!==undefined?a.open:(b.open??null),closed:a.closed||b.closed||null};
}
const upsertHist=x=>{const i=S.hist.findIndex(h=>h.id===x.id);i<0?S.hist.push(x):S.hist[i]=x};
async function pull(){
  const {data:rows,error}=await sb.from('shifts').select('id,data').eq('staff_id',user.id).gte('date',ymd(premium?45:7)).order('id');
  if(error)throw error;
  rows.forEach(r=>{let d=r.data;
    if(d.id===S.day.id){Object.assign(S.day,mergeDay(S.day,d));d=S.day}
    else if(!d.closed&&(S.day.open===null||(S.day.closed&&d.id>S.day.id)))S.day=d;
    if(d.closed)upsertHist(d);
  });
  S.hist.sort((a,b)=>a.id-b.id);
}
async function pushMissing(){
  const m=new Map();[...S.hist,S.day].forEach(d=>{if(!d.demo&&(d.open!==null||d.tx.length))m.set(d.id,d)});
  const rows=[...m.values()].map(d=>({user_id:BIZ,staff_id:user.id,id:d.id,date:d.date,data:d}));
  if(rows.length)await sb.from('shifts').upsert(rows,{onConflict:'user_id,id'});
}
function queueSync(){if(!cloud||!user||!okAccess)return;clearTimeout(syncT);setCs('Saving…');syncT=setTimeout(pushDay,600)}
async function pushDay(){
  const d=S.day;if(!cloud||!user||!okAccess||(d.open===null&&!d.tx.length))return;
  try{
    const {data:r}=await sb.from('shifts').select('data').eq('user_id',BIZ).eq('id',d.id).maybeSingle();
    let changed=false;
    if(r&&r.data){const before=JSON.stringify(d),m=mergeDay(d,r.data);Object.assign(d,m);changed=before!==JSON.stringify(d)}
    const {error}=await sb.from('shifts').upsert({user_id:BIZ,staff_id:user.id,id:d.id,date:d.date,data:d},{onConflict:'user_id,id'});
    if(error)throw error;
    persist();setCs('Synced');if(changed)render();
  }catch(e){
    if(e&&e.code==='42501'){setCs('Premium required to sync');return}
    console.error(e);setCs('Offline: '+((e&&e.message)||'will retry').slice(0,80));clearTimeout(syncT);syncT=setTimeout(pushDay,8000);
  }
}

async function addDebt(){
  const name=$('#d_n').value.trim(),a=v('d_a');
  if(!name||a<=0)return toast('Enter a name and amount','bg-rose-500 text-white');
  const {error}=await sb.from('debts').insert({user_id:BIZ,name,phone:$('#d_p').value.trim(),amount:a,note:$('#d_o').value.trim()});

function payDebt(id){
  const x=debtRows.find(r=>r.id===id),rem=x.amount-x.paid;
  modal(`<h3 class="text-xl font-bold mb-1">Payment from ${x.name.replace(/</g,'&lt;')}</h3><p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Still owes ${fmt(rem)}.</p>

async function doPay(id){

  if(a<=0||a>rem)return toast('Enter an amount up to '+fmt(rem),'bg-rose-500 text-white');

  sb=supabase.createClient(SB_URL,SB_KEY);
  $('#out').onclick=()=>sb.auth.signOut();$('#prem').onclick=openPremium;$('#team').onclick=openTeam;
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){user=null;okAccess=true;acc={};$('#app').innerHTML='';$('#out').classList.add('hidden');setCs('');showAuth()}});
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return showAuth();
  await enter(session.user);
}
boot();
</script>
