<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POS Assistant · by Irete Labs</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#34d399">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="POS Assistant">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>try{var t=localStorage.getItem('irete_theme');if(t==='light')document.documentElement.classList.remove('dark')}catch(e){}</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="config.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.num{font-variant-numeric:tabular-nums}
.card{@apply rounded-2xl}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pop{animation:pop .35s ease}
input:focus{outline:2px solid #34d399}
</style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen">
<header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-950/90 backdrop-blur border-b border-slate-200 dark:border-slate-800">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
    <div class="w-9 h-9 rounded-xl bg-emerald-400 text-slate-950 grid place-items-center font-black">P</div>
    <div class="leading-tight"><div class="font-bold">POS Assistant</div><div class="text-xs text-slate-500 dark:text-slate-400">by Irete Labs</div></div>
    <div class="ml-auto flex items-center gap-2">
      <label class="flex items-center gap-2 text-xs cursor-pointer select-none">
        <span class="hidden sm:inline text-slate-500 dark:text-slate-400">Auto-simulate terminal</span>
        <span class="sm:hidden text-slate-500 dark:text-slate-400">Sim</span>
        <input id="sim" type="checkbox" class="sr-only peer">
        <span class="w-10 h-6 rounded-full bg-slate-300 dark:bg-slate-700 peer-checked:bg-emerald-400 relative transition after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-5 after:h-5 after:rounded-full after:bg-white after:transition peer-checked:after:translate-x-4"></span>
      </label>
      <span id="cs" class="hidden sm:inline text-xs text-slate-500 dark:text-slate-400"></span>
      <button id="prem" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 hidden text-amber-400" aria-label="Premium"><i data-lucide="crown" class="w-5 h-5"></i></button>
      <button id="team" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 hidden" aria-label="Team"><i data-lucide="users" class="w-5 h-5"></i></button>
      <button id="help" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800" aria-label="Help and guide" onclick="openGuide()"><i data-lucide="circle-help" class="w-5 h-5"></i></button>
      <button id="theme" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800" aria-label="Toggle theme"><i data-lucide="sun-moon" class="w-5 h-5"></i></button>
      <button id="cfg" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800" aria-label="Settings"><i data-lucide="settings" class="w-5 h-5"></i></button>
      <button id="out" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 hidden" aria-label="Sign out"><i data-lucide="log-out" class="w-5 h-5"></i></button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-4 space-y-4" id="app"></main>
<div id="modal"></div>
<div id="auth"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-50 pointer-events-none"></div>

<script>
const K='irete_pos_v1',$=s=>document.querySelector(s);
const ymd=(off=0)=>new Date(Date.now()-off*864e5).toLocaleDateString('en-CA');
const fmt=n=>(n<0?'-':'')+'₦'+Math.abs(Math.round(n)).toLocaleString('en-NG');
const DEF={set:{mode:'',wMode:'manual',wVal:0,tMode:'manual',tVal:0,blk:10000,pct:0,cap:0,low:20000},day:null,hist:[]};
// ===== CLOUD CONFIG: fill these in (leave SB_URL empty to run in local-only mode) =====
const CFG=window.APP_CONFIG||{},SB_URL=CFG.SB_URL||'',SB_KEY=CFG.SB_KEY||'',PAYSTACK_KEY=CFG.PAYSTACK_KEY||'',PRICE_NGN=CFG.PRICE_NGN||3000;
const BIZ_NGN=CFG.BUSINESS_NGN||20000,SETUP_NGN=CFG.SETUP_NGN??50000;
const BANK=CFG.BANK||{bank:'',acct:'',holder:'',whatsapp:''};
const BUILD='2026.11.10-b'; // shown in the footer so you can confirm which version is live
const cloud=!!(SB_URL&&SB_KEY);
let KEY=K,S,sb,user=null,okAccess=true,acc={},syncT=null,pollT=null;
const clone=o=>JSON.parse(JSON.stringify(o));
const newDay=()=>({id:Date.now(),date:ymd(),open:null,inj:[],tx:[],closed:null,del:[],idel:[]});
function load(key){
  KEY=key;try{S=JSON.parse(localStorage.getItem(KEY))||clone(DEF)}catch(e){S=clone(DEF)}
  S.set=Object.assign({},DEF.set,S.set);S.hist=S.hist||[];
  if(!S.day)S.day=newDay();
  if(S.day.date!==ymd()){ // archive a stale unreconciled shift
    if(!S.day.closed&&S.day.open!==null){S.day.closed={auto:true};S.hist.push(S.day)}
    S.day=newDay();
  }
  persist();
}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{persist();queueSync()};

// ---- business maths ----
// Withdrawal: customer swipes amount+fee, gets cash=amount. Processor cost = pct% capped.
// Transfer: customer sends amount to our bank, gets cash = amount - fee.
function calc(a,type){
  const s=S.set,w=type==='w',m=w?s.wMode:s.tMode,x=w?s.wVal:s.tVal;
  const fee=m==='fixed'?x:m==='pct'?a*x/100:m==='block'?Math.ceil(a/(s.blk||10000))*x:0;
  return {fee:Math.round(fee),cost:w?Math.min(a*s.pct/100,s.cap||Infinity):0};
}
function mk(a,type,fee,cost,src,ref,t,cash){
  const w=type==='w',co=w?a:(cash!=null?cash:a-fee),fe=w?fee:a-co,di=w?a+fee-cost:a;
  return {id:Math.random().toString(36).slice(2),t:t||Date.now(),type,a,fee:fe,cost,cashOut:co,digIn:di,profit:fe-cost,src:src||'manual',ref:ref||''};
}
const sum=(arr,f)=>arr.reduce((x,y)=>x+f(y),0);
function stats(d0){
  const d={...d0,tx:d0.tx.filter(t=>!t.voided)};
  const inj=sum(d.inj,i=>i.a),cashOut=sum(d.tx,t=>t.cashOut),digIn=sum(d.tx,t=>t.digIn);
  return {inj,cashOut,digIn,vol:sum(d.tx,t=>'wtsc'.includes(t.type)?t.a:0),credit:sum(d.tx,t=>t.type==='d'||t.type==='c'?t.a:t.type==='r'?-t.a:0),qty:sum(d.tx,t=>t.type==='s'?(t.qty||0):0),m:{cash:sum(d.tx,t=>t.type==='s'&&t.method==='cash'?t.a:0),pos:sum(d.tx,t=>t.type==='s'&&t.method==='pos'?t.a:0),transfer:sum(d.tx,t=>t.type==='s'&&t.method==='transfer'?t.a:0)},profit:sum(d.tx,t=>t.profit),n:d.tx.length,
    drawer:(d.open||0)+inj-cashOut, expCash:(d.open||0)+inj-cashOut};
}

// ---- UI helpers ----
const inp='w-full rounded-xl px-4 py-3 text-lg num bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700';
const btn='rounded-xl px-4 py-3 font-semibold transition active:scale-95';
function modal(html){
  $('#modal').innerHTML=`<div class="fixed inset-0 z-40 bg-black/60 grid items-end sm:place-items-center" onclick="if(event.target===this)closeM()">
  <div class="pop w-full sm:max-w-md bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl p-5 max-h-[92vh] overflow-y-auto" style="padding-bottom:max(1.25rem,env(safe-area-inset-bottom))">${html}</div></div>`;
  lucide.createIcons();
}
const closeM=()=>$('#modal').innerHTML='';
function toast(msg,cls='bg-emerald-400 text-slate-950'){
  const e=document.createElement('div');e.className='pop px-4 py-2 mb-2 rounded-xl text-sm font-semibold shadow-lg '+cls;e.textContent=msg;
  $('#toast').appendChild(e);setTimeout(()=>e.remove(),2600);
}
const v=id=>parseFloat($('#'+id).value)||0;

// ---- actions ----
function startDay(){
  const o=v('f_open');if(o<0)return;
  if(cloud&&S.day.open!==null){const dl=o-S.day.open;if(dl)S.day.inj.push({a:dl,t:Date.now(),note:'Opening float correction'})}else S.day.open=o;
  save();closeM();render();toast('Opening float set: '+fmt(o));
}
function openStart(edit){modal(`<h3 class="text-xl font-bold mb-1">${edit?'Edit opening float':'Start the day'}</h3><p class="text-sm text-slate-500 dark:text-slate-400 mb-4">${isAgent()?'Cash you started the day with in the drawer.':'Cash in the till at the start of the day, for change. Leave it empty or enter 0 if you start with none.'}</p>
  <input id="f_open" type="number" inputmode="numeric" class="${inp}" placeholder="${isAgent()?'Opening cash float (₦)':'Starting cash (₦), 0 if none'}" value="${edit?S.day.open:''}" autofocus>
  <button class="${btn} w-full mt-4 bg-emerald-400 text-slate-950" onclick="startDay()">${edit?'Save':'Open session'}</button>`)}
function openInject(){modal(`<h3 class="text-xl font-bold mb-1">Cash injection</h3><p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Extra physical cash added to the till.</p>
  <input id="f_inj" type="number" inputmode="numeric" class="${inp}" placeholder="Amount (₦)" autofocus>
  <input id="f_note" class="${inp} mt-3 !text-base" placeholder="Note (optional, e.g. from owner)">
  <button class="${btn} w-full mt-4 bg-sky-400 text-slate-950" onclick="doInject()">Add cash to drawer</button>`)}
function doInject(){const a=v('f_inj');if(a<=0)return toast('Enter an amount','bg-rose-500 text-white');
  S.day.inj.push({a,t:Date.now(),note:$('#f_note').value});save();closeM();render();toast(fmt(a)+' added to drawer','bg-sky-400 text-slate-950')}

let feeTouched=false;
function openTxn(type){
  feeTouched=false;const w=type==='w';
  modal(`<h3 class="text-xl font-bold mb-1">${w?'Cash withdrawal':'Transfer received'}</h3>
  <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">${w?'Customer swipes card (amount + your charge), you give cash.':'Customer sends money to your account, you give cash.'}</p>
  <label class="block text-xs mb-1 text-slate-500 dark:text-slate-400">${w?'Cash amount':'Amount received in account'} (₦)</label>
  <input id="f_amt" type="number" inputmode="numeric" class="${inp}" oninput="prev('${type}','a')" autofocus>
  <div class="grid grid-cols-4 gap-2 mt-2">${[5000,10000,20000,50000].map(x=>`<button class="text-xs py-2 rounded-lg bg-slate-200 dark:bg-slate-800" onclick="$('#f_amt').value=${x};prev('${type}','a')">${x/1000}k</button>`).join('')}</div>
  <label class="block text-xs mt-4 mb-1 text-slate-500 dark:text-slate-400">Your charge (₦)</label>
  <input id="f_fee" type="number" inputmode="numeric" class="${inp}" oninput="prev('${type}','f')">
  ${w?'':`<label class="block text-xs mt-3 mb-1 text-slate-500 dark:text-slate-400">Cash given to customer (₦)</label>
  <input id="f_cash" type="number" inputmode="numeric" class="${inp}" oninput="prev('t','c')">`}
  <input id="f_ref" class="${inp} mt-3 !text-base" placeholder="Customer / bank ref (optional)">
  <div id="prev" class="mt-4 rounded-xl p-3 bg-slate-100 dark:bg-slate-800 text-sm space-y-1"></div>
  <button class="${btn} w-full mt-4 ${w?'bg-amber-400':'bg-emerald-400'} text-slate-950" onclick="doTxn('${type}')">Record transaction</button>`);
  prev(type,'a');
}
function prev(type,src){
  const a=v('f_amt'),w=type==='w';
  if(src==='f'||src==='c')feeTouched=true;
  if(src==='a'&&!feeTouched){const f=calc(a,type).fee;$('#f_fee').value=a>0&&f?f:''}
  if(src==='c')$('#f_fee').value=a>0?a-v('f_cash'):'';
  const fee=v('f_fee');
  if(!w&&src!=='c')$('#f_cash').value=a>0?a-fee:'';
  const t=mk(a,type,fee,w?calc(a,type).cost:0,0,0,0,w?null:v('f_cash'));
  $('#prev').innerHTML=a>0?`<div class="flex justify-between"><span>Cash to give</span><b class="num">${fmt(t.cashOut)}</b></div>
  <div class="flex justify-between"><span>${w?'Digital received (card + charge)':'Digital received'}</span><b class="num">${fmt(t.digIn)}</b></div>
  ${t.cost?`<div class="flex justify-between"><span>Processor cost</span><b class="num">${fmt(t.cost)}</b></div>`:''}
  <div class="flex justify-between ${t.profit<0?'text-rose-500':'text-emerald-500'}"><span>Your profit</span><b class="num">${fmt(t.profit)}</b></div>`:'<span class="text-slate-500">Enter an amount to preview.</span>';
}
function doTxn(type){
  const a=v('f_amt'),w=type==='w';
  if(a<=0)return toast('Enter an amount','bg-rose-500 text-white');
  const t=mk(a,type,v('f_fee'),w?calc(a,type).cost:0,'manual',$('#f_ref').value,0,w?null:v('f_cash'));
  if(t.cashOut<0)return toast('Cash given cannot be negative','bg-rose-500 text-white');
  const short=t.cashOut>stats(S.day).drawer;
  S.day.tx.unshift(t);save();closeM();render();
  toast((w?'Withdrawal ':'Transfer ')+fmt(a)+' recorded · profit '+fmt(t.profit));
  if(short)setTimeout(()=>toast('Drawer cash is now negative: check float/injections','bg-rose-500 text-white'),400);
}
function voidTx(id,b){
  if(!b.dataset.s){b.dataset.s=1;b.textContent='tap again to void';setTimeout(()=>{b.dataset.s='';b.textContent='void'},3000);return}
  (S.day.del=S.day.del||[]).push(id);S.day.tx=S.day.tx.filter(t=>t.id!==id);save();render();
}
function delInj(i,b){
  if(!b.dataset.s){b.dataset.s=1;b.textContent='sure?';setTimeout(()=>{b.dataset.s='';b.textContent='remove'},3000);return}
  if(cloud){const x=S.day.inj[i];S.day.inj.push({a:-x.a,t:Date.now(),note:'Correction of '+fmt(x.a)});save();render();return}
  (S.day.idel=S.day.idel||[]).push(S.day.inj[i].t);S.day.inj.splice(i,1);save();render();
}
function eraseAll(b){
  if(!b.dataset.s){b.dataset.s=1;b.textContent='Tap again to erase everything';return}
  localStorage.removeItem(KEY);location.reload();
}
function openClose(){
  const st=stats(S.day);
  modal(`<h3 class="text-xl font-bold mb-1">Close day / shift balance</h3>
  <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Count the physical cash in your drawer.</p>
  <label class="block text-xs mb-1 text-slate-500 dark:text-slate-400">Physical cash counted</label>
  <input id="f_cnt" type="number" inputmode="numeric" class="${inp}" oninput="recon()" autofocus>
  <label class="block text-xs mt-3 mb-1 text-slate-500 dark:text-slate-400">${isAgent()?'Bank received today (optional, from statement)':'POS + transfer total per terminal/bank report (optional)'}</label>
  <input id="f_bank" type="number" inputmode="numeric" class="${inp}" oninput="recon()">
  ${isStock()?`<label class="block text-xs mt-3 mb-1 text-slate-500 dark:text-slate-400">${isGas()?'Gas left in tank now (kg)':'Bags counted in the warehouse now'}</label><input id="f_tank" type="number" step="any" inputmode="decimal" class="${inp}" oninput="recon()">`:''}
  <div class="mt-4 rounded-xl p-3 bg-slate-100 dark:bg-slate-800 text-sm space-y-1">
    <div class="flex justify-between"><span>Expected cash</span><b class="num">${fmt(st.expCash)}</b></div>
    <div class="flex justify-between"><span>Expected digital inflow</span><b class="num">${fmt(st.digIn)}</b></div>
    <div class="flex justify-between"><span>Net profit today</span><b class="num text-emerald-500">${fmt(st.profit)}</b></div>
  </div>
  <div id="rc" class="mt-3"></div>
  <button class="${btn} w-full mt-4 bg-rose-500 text-white" onclick="doClose()">Close &amp; lock day</button>`);
}
function rec(){
  const st=stats(S.day),cnt=v('f_cnt'),bk=$('#f_bank').value;
  const vc=cnt-st.expCash,vb=bk===''?null:parseFloat(bk)-st.digIn;
  const sk=S.day.stock||{open:null,add:[]},ek=(sk.open||0)+sum(sk.add,x=>x.a)-st.qty,te=$('#f_tank'),tk=te&&te.value!==''?parseFloat(te.value):null;
  const mt=isFuel()?meterTotals(S.day):null,got=st.m.cash+st.m.pos+st.m.transfer,vm=mt&&mt.rows.length?Math.round(got-mt.expected):null;
  return {st,cnt,vc,vb,bk,tk,ek,mt,got,vm,vt:tk===null?null:Math.round((tk-ek)*100)/100};
}
function flag(label,x){
  const c=x===0?'bg-emerald-500/15 text-emerald-500':x>0?'bg-emerald-500/15 text-emerald-500':'bg-rose-500/15 text-rose-500';
  const w=x===0?'BALANCED':x>0?'OVERAGE +'+fmt(x):'SHORTAGE '+fmt(x);
  return `<div class="rounded-xl p-3 ${c} flex justify-between items-center"><span class="text-sm">${label}</span><b class="text-base num">${w}</b></div>`;
}
function recon(){
  if($('#f_cnt').value==='')return $('#rc').innerHTML='';
  const r=rec();
  $('#rc').innerHTML=`<div class="space-y-2">${flag('Cash',r.vc)}${r.vb===null?'':flag('Digital',r.vb)}${r.vt===null?'':flagKg(isGas()?'Gas in tank':'Warehouse stock',r.vt,unit())}${r.vm==null?'':flag('Pump meters vs money collected',r.vm)}</div>`;
}
function doClose(){
  if($('#f_cnt').value==='')return toast('Enter counted cash','bg-rose-500 text-white');
  const r=rec();
  S.day.closed={at:Date.now(),counted:r.cnt,varCash:r.vc,bankSeen:r.bk===''?null:parseFloat(r.bk),varBank:r.vb,tank:r.vt===null?null:{counted:r.tk,expected:r.ek,var:r.vt},meter:r.vm==null?null:{expected:r.mt.expected,received:r.got,var:r.vm},expCash:r.st.expCash,expBank:r.st.digIn};
  S.hist.push(S.day);save();closeM();$('#sim').checked=false;stopSim();render();
}
function newShift(){S.day=newDay();save();render()}

function openCfg(){
  const s=S.set,sel=(id,m)=>`<select id="${id}" class="${inp} !text-base">${[['manual','I enter it each time'],['fixed','Fixed ₦ per transaction'],['pct','% of amount'],['block','₦ per block of amount']].map(o=>`<option value="${o[0]}" ${o[0]===m?'selected':''}>${o[1]}</option>`).join('')}</select>`;
  const f=(id,l,x)=>`<label class="block text-xs mt-3 mb-1 text-slate-500 dark:text-slate-400">${l}</label><input id="${id}" type="number" step="any" class="${inp}" value="${x}">`;
  modal(`<h3 class="text-xl font-bold">Your charges</h3><p class="text-sm text-slate-500 dark:text-slate-400">You decide how fees work. The charge is always editable on each transaction.</p>
  <button class="${btn} w-full mt-3 bg-emerald-400 text-slate-950 text-left flex items-center gap-2" onclick="openGuide()"><i data-lucide="book-open" class="w-5 h-5"></i>Step-by-step guide</button>
  <button class="${btn} w-full mt-3 bg-slate-200 dark:bg-slate-800 text-left" onclick="openMode(false)">Business type: ${MODES[s.mode||'agent'].n} (change)</button>
  <div class="font-semibold mt-4">Withdrawals (POS cash agents)</div>${sel('s_wm',s.wMode)}${f('s_wv','Value (₦ or %, ignored if “each time”)',s.wVal)}
  <div class="font-semibold mt-4">Transfers</div>${sel('s_tm',s.tMode)}${f('s_tv','Value (₦ or %, ignored if “each time”)',s.tVal)}
  ${f('s_b','Block size for “per block” (₦)',s.blk)}
  <div class="font-semibold mt-4">Optional: your own cost</div>
  ${f('s_p','Processor cost on withdrawals (% of amount, 0 if none)',s.pct)}${f('s_c','Cost cap per transaction (₦, 0 = no cap)',s.cap)}
  ${f('s_l','Low-cash warning below (₦)',s.low)}
  <button class="${btn} w-full mt-4 bg-emerald-400 text-slate-950" onclick="saveCfg()">Save</button>
  <button class="${btn} w-full mt-2 bg-slate-200 dark:bg-slate-800" onclick="demo()" ${cloud?'hidden':''}>Load 6 days of demo history</button>
  <button class="${btn} w-full mt-2 text-rose-500 border border-rose-500/40" onclick="eraseAll(this)" ${cloud?'hidden':''}>Erase all data</button>`);
}
function saveCfg(){S.set={mode:S.set.mode,menu:S.set.menu||[],wMode:$('#s_wm').value,wVal:v('s_wv'),tMode:$('#s_tm').value,tVal:v('s_tv'),blk:v('s_b')||10000,pct:v('s_p'),cap:v('s_c'),low:v('s_l')};save();closeM();render();pushSet();toast('Charges saved')}
function demo(){
  S.hist=S.hist.filter(d=>!d.demo);
  for(let i=6;i>=1;i--){
    const d=newDay();d.id=i;d.demo=1;d.date=ymd(i);d.open=50000;
    const n=12+Math.floor(Math.random()*14);
    for(let k=0;k<n;k++){const a=[2000,5000,10000,15000,20000,30000,50000][Math.floor(Math.random()*7)],ty=Math.random()<.6?'w':'t';d.tx.push(mk(a,ty,Math.ceil(a/10000)*100,0,'demo'));}

function mergeDay(a,b){
  const del=[...new Set([...(a.del||[]),...(b.del||[])])],idel=[...new Set([...(a.idel||[]),...(b.idel||[])])];
  const m=new Map();[...(b.tx||[]),...(a.tx||[])].forEach(t=>{const e=m.get(t.id);m.set(t.id,e&&e.voided&&!t.voided?e:t)});
  const im=new Map();[...(b.inj||[]),...(a.inj||[])].forEach(x=>im.set(x.t,x));
  return {...a,tx:[...m.values()].filter(t=>!del.includes(t.id)).sort((x,y)=>y.t-x.t),
    inj:[...im.values()].filter(x=>!idel.includes(x.t)).sort((x,y)=>x.t-y.t),del,idel,
    open:a.open!==null&&a.open!==undefined?a.open:(b.open??null),closed:a.closed||b.closed||null};
}
const upsertHist=x=>{const i=S.hist.findIndex(h=>h.id===x.id);i<0?S.hist.push(x):S.hist[i]=x};
async function pull(){
  const {data:rows,error}=await sb.from('shifts').select('id,data').eq('staff_id',user.id).gte('date',ymd(premium?45:7)).order('id');
  if(error)throw error;
  rows.forEach(r=>{let d=r.data;
    if(d.id===S.day.id){Object.assign(S.day,mergeDay(S.day,d));d=S.day}
    else if(!d.closed&&(S.day.open===null||(S.day.closed&&d.id>S.day.id)))S.day=d;
    if(d.closed)upsertHist(d);
  });
  S.hist.sort((a,b)=>a.id-b.id);
  try{const {data:vs}=await sb.from('tx_voids').select('shift_id,tx_id,status,reason').eq('staff_id',user.id);
    const mp={};(vs||[]).forEach(x=>mp[x.shift_id+':'+x.tx_id]=x);
    [S.day,...S.hist].forEach(d=>d.tx.forEach(t=>{const x=mp[d.id+':'+t.id];if(!x)return;if(x.status==='voided')t.voided={reason:x.reason,by:'owner'};else if(x.status==='rejected')t.reqVoid=false}))}catch(e){}
}

}

async function pushDay(){

  try{
    const {data:r}=await sb.from('shifts').select('data').eq('user_id',BIZ).eq('id',d.id).maybeSingle();
    let changed=false;
    if(r&&r.data){const before=JSON.stringify(d),m=mergeDay(d,r.data);Object.assign(d,m);changed=before!==JSON.stringify(d)}
    const {error}=await sb.from('shifts').upsert({user_id:BIZ,staff_id:user.id,id:d.id,date:d.date,data:d},{onConflict:'user_id,id'});
    if(error)throw error;

  try{if((await checkAccess())&&premium){$('#auth').innerHTML='';closeM();render();await pushMissing();pushDay();startPoll();toast('Subscription active');return}}catch(e){}
  if(n<12)setTimeout(()=>waitSub(n+1),3000);else $('#aerr').textContent='Still confirming. If you were charged, it will activate shortly: refresh in a minute.';
}
async function enter(u){
  user=u;$('#auth').innerHTML='';$('#out').classList.remove('hidden');
  load(K+':'+u.id);render();setCs('Syncing…');
  try{
    const ok=await checkAccess();
    if(!ok){await sb.auth.signOut();setTimeout(()=>{const e=$('#aerr');if(e)e.textContent='This account is no longer active.'},150);return}
    applyRole();await pull();persist();render();maybeAskMode();maybeOnboard();await pushMissing();
    setCs('Synced');startPoll();
  }catch(e){console.error(e);applyRole();setCs('Setup error: '+((e&&e.message)||'see console'));toast('Setup problem: '+((e&&e.message)||e),'bg-rose-500 text-white')}
}

async function staffCall(body){

function exportCsv(){

async function addDebt(){

function payDebt(id){
  const x=debtRows.find(r=>r.id===id),rem=x.amount-x.paid;
  modal(`<h3 class="text-xl font-bold mb-1">Payment from ${x.name.replace(/</g,'&lt;')}</h3><p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Still owes ${fmt(rem)}.</p>
  <input id="p_a" type="number" inputmode="numeric" class="${inp}" value="${rem}">
  <select id="p_m" class="${inp} mt-3 !text-base">${shiftOpen()?'<option value="cash">Paid cash (into drawer)</option><option value="transfer">Paid by transfer (to account)</option>':''}<option value="none">Don’t add to today’s ledger</option></select>
  <button class="${btn} w-full mt-4 bg-emerald-400 text-slate-950" onclick="doPay(${id})">Save payment</button>`);
}
async function doPay(id){
  const x=debtRows.find(r=>r.id===id),a=v('p_a'),m=$('#p_m').value,rem=x.amount-x.paid;
  if(a<=0||a>rem)return toast('Enter an amount up to '+fmt(rem),'bg-rose-500 text-white');
  const np=Number(x.paid)+a;
  const {error}=await sb.from('debts').update({paid:np,settled_at:np>=x.amount?new Date().toISOString():null}).eq('id',id);
  if(error)return toast('Could not save: '+error.message,'bg-rose-500 text-white');
  if(m!=='none')ledger('r',a,m,x.name);
  toast(np>=x.amount?x.name+' has paid in full':'Payment recorded');openDebts();
}

const EXP=['Rent','Generator / fuel','Staff wages','Data & airtime','Terminal / maintenance','Other'];
async function openExpenses(){
  modal('<div class="text-sm text-slate-500">Loading…</div>');
  if(!premium)return setPop(mHead('Expenses & net profit','wallet')+lockBox('Expenses and net profit'));
  const ms=ymd().slice(0,8)+'01';
  const [a,b]=await Promise.all([sb.from('expenses').select('*').gte('date',ms).order('date',{ascending:false}),sb.from('shifts').select('data').gte('date',ms)]);
  if(a.error)return setPop(mHead('Expenses & net profit','wallet')+'<div class="text-sm text-rose-500">Could not load: '+a.error.message+'</div>');
  const ex=a.data||[],tot=sum(ex,x=>+x.amount),comm=sum(b.data||[],r=>stats(r.data).profit),net=comm-tot,cat={};
  ex.forEach(x=>cat[x.category]=(cat[x.category]||0)+ +x.amount);
  const sub='text-xs text-slate-500 dark:text-slate-400',inp2=`${inp} !text-base mb-2`;
  setPop(mHead('Expenses & net profit','wallet')+`<div class="${sub} mb-2">${new Date().toLocaleDateString('en-NG',{month:'long',year:'numeric'})}</div>
  <div class="rounded-2xl p-4 bg-slate-100 dark:bg-slate-800 space-y-1"><div class="flex justify-between text-sm"><span>Commissions earned</span><b class="num text-emerald-500">${fmt(comm)}</b></div>
  <div class="flex justify-between text-sm"><span>Expenses</span><b class="num text-rose-400">${fmt(tot)}</b></div>
  <div class="flex justify-between border-t border-slate-300 dark:border-slate-700 pt-2"><b>Net profit (what you keep)</b><b class="num text-xl ${net<0?'text-rose-500':'text-emerald-500'}">${fmt(net)}</b></div></div>
  ${Object.keys(cat).length?`<div class="mt-3 text-sm">${Object.keys(cat).map(k=>`<div class="flex justify-between py-1"><span>${k}</span><b class="num">${fmt(cat[k])}</b></div>`).join('')}</div>`:''}
  ${ex.slice(0,15).map(x=>`<div class="flex items-center text-sm py-2 border-t border-slate-200 dark:border-slate-800"><div class="min-w-0 flex-1"><div>${x.category}${x.note?' · '+x.note.replace(/</g,'&lt;'):''}</div><div class="${sub}">${x.date}</div></div><b class="num">${fmt(+x.amount)}</b><button class="text-xs text-rose-500 ml-3" onclick="delExpense(${x.id},this)">remove</button></div>`).join('')}
  <div class="font-bold mt-4 mb-2">Add an expense</div>
  <select id="e_c" class="${inp2}">${EXP.map(c=>`<option>${c}</option>`).join('')}</select>
  <input id="e_a" type="number" inputmode="numeric" class="${inp2}" placeholder="Amount (₦)"><input id="e_n" class="${inp2}" placeholder="Note (optional)">
  <button class="${btn} w-full bg-emerald-400 text-slate-950" onclick="addExpense()">Save expense</button>`);
}
async function addExpense(){
  const a=v('e_a');if(a<=0)return toast('Enter an amount','bg-rose-500 text-white');
  const {error}=await sb.from('expenses').insert({user_id:BIZ,category:$('#e_c').value,amount:a,note:$('#e_n').value.trim(),date:ymd()});
  if(error)return toast('Could not save: '+error.message,'bg-rose-500 text-white');
  toast('Expense saved');openExpenses();
}
async function delExpense(id,b){
  if(!b.dataset.s){b.dataset.s=1;b.textContent='sure?';setTimeout(()=>{b.dataset.s='';b.textContent='remove'},3000);return}
  await sb.from('expenses').delete().eq('id',id);openExpenses();
}

function meterTotals(d){
  const m={};
  d.tx.filter(t=>t.type==='m'&&!t.voided).sort((a,b)=>a.t-b.t).forEach(t=>{const p=m[t.pump]=m[t.pump]||{n:t.pump,fuel:t.fuel,p:t.p,o:null,c:null};if(t.which==='open')p.o=t.reading;else p.c=t.reading;p.fuel=t.fuel;p.p=t.p});
  const rows=Object.values(m).filter(r=>r.o!==null&&r.c!==null).map(r=>({...r,l:Math.round((r.c-r.o)*100)/100,exp:Math.round((r.c-r.o)*r.p)}));
  return {rows,open:Object.values(m),expected:sum(rows,r=>r.exp)};
}
function meterCard(d){
  if(!isFuel())return '';
  const mt=meterTotals(d),sub='text-xs text-slate-500 dark:text-slate-400';
  return `<section class="${CARD}"><div class="font-bold mb-2 flex items-center gap-2"><i data-lucide="fuel" class="w-4 h-4 text-orange-400"></i>Pump meters${biz()?'':'<i data-lucide="lock" class="w-3 h-3 text-amber-400"></i>'}</div>
  ${mt.open.length?mt.open.map(r=>`<div class="flex justify-between text-sm py-1"><span>${esc(r.n)} · ${esc(r.fuel)} <span class="${sub}">open ${r.o??'—'} · close ${r.c??'—'}</span></span><b class="num">${r.o!==null&&r.c!==null?Math.round((r.c-r.o)*100)/100+' L · '+fmt((r.c-r.o)*r.p):'—'}</b></div>`).join(''):`<div class="${sub}">No readings yet. Add each pump’s opening reading at the start of the shift.</div>`}

}

function addMenu(i){const m=S.set.menu[i],x=cart.find(c=>c.n===m.n&&c.p===m.p);x?x.q++:cart.push({n:m.n,q:1,p:m.p});drawSale()}

async function confirmVoid(id){

// ===== ADD-ONLY LEDGER: staff can add entries but never edit or delete them =====
async function pushLedger(d){
  const done=new Set(d._p||[]),rows=[];
  const add=(id,kind,data)=>{if(!done.has(id))rows.push({user_id:BIZ,staff_id:user.id,shift_id:d.id,shift_date:d.date,entry_id:id,kind,data})};
  if(d.open!==null&&d.open!==undefined)add('open','open',{a:d.open});
  d.inj.forEach(x=>add('i'+x.t,'inj',x));
  d.tx.forEach(t=>{const {voided,reqVoid,...c}=t;add(t.id,'tx',c)});
  if(d.closed)add('close','close',d.closed);
  for(let i=0;i<rows.length;i+=300){
    const part=rows.slice(i,i+300),{error}=await sb.from('ledger').upsert(part,{onConflict:'user_id,shift_id,entry_id',ignoreDuplicates:true});
    if(error)throw error;
    d._p=[...(d._p||[]),...part.map(r=>r.entry_id)];
  }
}
async function ledgerAll(from){
  let all=[],i=0;
  for(;;){
    const {data,error}=await sb.from('ledger').select('shift_id,shift_date,staff_id,kind,data').gte('shift_date',from).order('id').range(i,i+999);
    if(error)throw error;all=all.concat(data);if(data.length<1000)break;i+=1000;
  }
  return all;
}
function buildShifts(rows){
  const m={};
  rows.forEach(r=>{const s=m[r.shift_id]=m[r.shift_id]||{id:r.shift_id,date:r.shift_date,staff_id:r.staff_id,data:{id:r.shift_id,date:r.shift_date,open:null,inj:[],tx:[],closed:null}},d=s.data;
    if(r.kind==='open')d.open=r.data.a;else if(r.kind==='inj')d.inj.push(r.data);else if(r.kind==='tx')d.tx.push(r.data);else if(r.kind==='close')d.closed=r.data});
  return Object.values(m).sort((a,b)=>b.id-a.id);
}

    sec.push(['7. Expenses and net profit (Premium)',L(['Tap <b>Expenses & net profit</b>.','Add rent, fuel, wages, data and other costs with the amount.','The page shows this month’s commissions minus expenses: what you actually keep.'])]);
    sec.push(['8. Plans, free trial and paying',L(['Tap the <b>crown</b> to see Premium and Business.','Tap <b>Start my 14-day free trial</b> to try everything free.','To pay: tap <b>Get Premium</b> or <b>Get Business</b>, choose 1, 3 or 12 months and send the amount to the account shown.','Tap <b>Send screenshot on WhatsApp</b>, then <b>I’ve paid</b>.','Your plan is switched on once the transfer is confirmed.'])]);
    sec.push(['9. Settings',L(['Tap the <b>gear</b> at the top.','<b>Your charges</b>: set how fees are worked out for POS cash agents.','<b>Business type</b>: change it if your business changes. Past records stay as they are.'])]);
  }
  modal(mHead('Step-by-step guide','book-open')+`<p class="text-sm text-slate-500 dark:text-slate-400 mb-3">Tap a topic to open it.</p>
  ${sec.map(([t,h])=>`<details class="rounded-xl bg-slate-100 dark:bg-slate-800 mb-2"><summary class="p-3 font-semibold cursor-pointer">${t}</summary><div class="px-3 pb-3 text-sm text-slate-600 dark:text-slate-300">${h}</div></details>`).join('')}
  <button class="${btn} w-full mt-2 bg-slate-200 dark:bg-slate-800" onclick="startTour()">Replay the 7-step tour</button>
  ${BANK.whatsapp?`<a href="https://wa.me/${BANK.whatsapp}?text=${encodeURIComponent('Hello, I need help with POS Assistant.')}" target="_blank" rel="noopener" class="${btn} block w-full mt-2 text-center bg-[#25D366] text-slate-950">Need help? Message us on WhatsApp</a>`:''}`);
}

// ===== INSTALL AS APP (PWA) =====
let deferredInstall=null;
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
const installHidden=()=>{try{return +localStorage.getItem('pwa_hide')>Date.now()}catch(e){return false}};
function installCard(){
  if(isStandalone()||installHidden()||(!deferredInstall&&!isIOS()))return '';
  return `<section class="rounded-2xl p-4 bg-sky-400/10 border border-sky-400/30 flex items-center gap-3"><i data-lucide="smartphone" class="w-6 h-6 text-sky-400 shrink-0"></i>
  <div class="flex-1 text-sm"><b>Install POS Assistant</b><div class="text-slate-500 dark:text-slate-400">${deferredInstall?'Open it from your home screen like an app.':'Tap the Share button, then “Add to Home Screen”.'}</div></div>
  ${deferredInstall?`<button class="${btn} !py-2 bg-sky-400 text-slate-950" onclick="doInstall()">Install</button>`:''}
  <button class="text-xs text-slate-500" onclick="hideInstall()">Not now</button></section>`;
}
async function doInstall(){if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;render()}
function hideInstall(){try{localStorage.setItem('pwa_hide',Date.now()+7*864e5)}catch(e){}render()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(S&&(user||!cloud))render()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;if(S&&(user||!cloud))render()});
if('serviceWorker' in navigator){
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded&&!$('#modal').innerHTML){reloaded=true;location.reload()}});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}));
}

async function boot(){
  if(!cloud){load(K);render();maybeAskMode();maybeOnboard();return}
  const sim=$('#sim');if(sim)sim.closest('label').style.display='none';
  sb=supabase.createClient(SB_URL,SB_KEY);
  $('#out').onclick=()=>sb.auth.signOut();$('#prem').onclick=openPremium;$('#team').onclick=openTeam;
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){user=null;okAccess=true;acc={};$('#app').innerHTML='';$('#out').classList.add('hidden');setCs('');showAuth()}});
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return showAuth();
  await enter(session.user);
}
boot();
</script>
